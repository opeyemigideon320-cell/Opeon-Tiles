<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Tiles 3</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body{
            color: black;
        }
        .size{
            width: 100%;
            height: 100%;
        }
        .size img{
            width: 100%;
            height: 100%;
            max-height: none;
            object-fit: cover;
            position: relative;

        }
        .screen-size{
            position: relative;
            overflow: hidden;
        }
        .name{
            position: absolute;
            bottom: clamp(1rem, 5vh, 3rem);
            left: 50%;
            width: 100%;
            padding: 0;
            transform: translateX(-50%);
        }
        .name a{
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="screen-size">
        <div class="size">
        <img src="images/magic3.jpg" alt="Magic Tiles 3">
        </div>
        <div class="name">
            <a href="index2.html">
            PLAY
            </a>
        </div>
    </div>
</body>
</html>
